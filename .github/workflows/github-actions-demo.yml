名称：GitHub Actions 演示
运行名称：${{ github.actor }} 正在测试 GitHub Actions 🚀
开启：[推送]
工作机会：
  探索 GitHub Actions：
    运行平台：ubuntu-latest
    步骤：
      - run: echo "🎉 该作业由 ${{ github.event_name }} 事件自动触发。"
      - run: echo "🐧 此作业现在正在 GitHub 托管的 ${{ runner.os }} 服务器上运行！"
      - run: echo "🔎 您的分支名称是 ${{ github.ref }}，您的仓库名称是 ${{ github.repository }}。"
      - name: 检出存储库代码
        使用：actions/checkout@v6
      - run: echo "💡 ${{ github.repository }} 仓库已克隆到运行器。"
      - run: echo "🖥️ 工作流现已准备就绪，可以在运行器上测试您的代码了。"
      - name: 列出存储库中的文件
        运行：|
          ls ${{ github.workspace }}
      - run: echo "🍏 此任务的状态为 ${{ job.status }}."
